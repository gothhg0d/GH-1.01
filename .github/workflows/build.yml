name: Build EBOOT.PBP

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: pspdev/pspdev:latest
    steps:
      - name: Install tools
        run: apk add --no-cache git make bash

      - uses: actions/checkout@v4

      - name: Build ARK-4 SystemControl user library
        run: |
          git clone --depth 1 https://github.com/PSP-Archive/ARK-4.git /tmp/ark4
          cd /tmp/ark4/libs/SystemCtrlForUser
          make ARKROOT=/tmp/ark4 || make ARKROOT=/tmp/ark4 -f Makefile
          cd -
          LIB=$(find /tmp/ark4 -name 'libpspsystemctrl_user.a' | head -n 1)
          echo "library: $LIB"
          test -n "$LIB"
          cp "$LIB" ark/

      - name: Build GH-1.01
        run: make

      - name: Package
        run: |
          mkdir -p pkg/PSP/GAME/GH101
          cp EBOOT.PBP pkg/PSP/GAME/GH101/
          ls -la EBOOT.PBP

      - uses: actions/upload-artifact@v4
        with:
          name: GH-1.01
          path: pkg/
